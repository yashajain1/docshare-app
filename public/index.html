<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DocShare - lightweight editor</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
      body { font-family: Arial, sans-serif; margin: 0; display:flex; height:100vh }
      #sidebar { width: 300px; border-right:1px solid #ddd; padding: 16px; box-sizing: border-box; overflow:auto }
      #main { flex:1; display:flex; flex-direction:column }
      .doc-item { padding:8px; border-bottom:1px solid #f0f0f0 }
      .doc-item .meta { font-size:12px; color:#666 }
      #editor { height: calc(100vh - 140px) }
      .toolbar { padding:8px; border-bottom:1px solid #eee }
      .controls { padding:8px }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div id="auth">
        <div id="me"></div>
        <input id="username" placeholder="username (alice or bob)" />
        <button id="login">Login</button>
      </div>
      <hr />
      <div class="controls">
        <input id="newTitle" placeholder="New doc title" />
        <button id="newDoc">New Document</button>
        <br/><br/>
        <input type="file" id="fileInput" />
        <button id="uploadBtn">Upload (.txt .md)</button>
      </div>
      <h3>Your documents</h3>
      <div id="docs"></div>
    </div>
    <div id="main">
      <div class="toolbar">
        <button id="saveBtn">Save</button>
        <button id="renameBtn">Rename</button>
        <input id="renameInput" placeholder="New title" />
        <input id="shareUser" placeholder="share with username" />
        <button id="shareBtn">Share</button>
      </div>
      <div id="editor"></div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
